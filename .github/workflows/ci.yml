name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install Python packages
        run: |
          set -o pipefail
          { python -m pip install -e ".[dev]" "playwright==1.64.0" && python -m playwright install --with-deps chromium; } 2>&1 | tail -n 40 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Install desktop packages
        working-directory: desktop
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: set -o pipefail; npm ci 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Lint
        run: set -o pipefail; ruff check src tests 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Test
        run: set -o pipefail; python -m pytest -q 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report back to the ci-reports branch
        # Whoever cannot open the Actions page (a token without Actions access) can still read how a run went with git.
        if: always()
        shell: bash
        working-directory: .
        env:
          STATUS: ${{ job.status }}
          TOKEN: ${{ github.token }}
        run: |
          log="$RUNNER_TEMP/ci.log"; touch "$log"
          dir="$RUNNER_TEMP/report"; rm -rf "$dir"; mkdir -p "$dir"; cd "$dir"
          git init -q
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          name="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}-${GITHUB_REF_NAME//\//_}-${GITHUB_JOB}.txt"
          for attempt in 1 2 3 4; do
            if git fetch -q origin ci-reports 2>/dev/null; then git checkout -q -B ci-reports FETCH_HEAD; else git checkout -q --orphan ci-reports; fi
            { echo "status: $STATUS"; echo "ref: $GITHUB_REF"; echo "sha: $GITHUB_SHA"; echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; tail -c 60000 "$log"; } > "$name"
            git add "$name"
            git -c user.name="continuum-ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI: $GITHUB_JOB $STATUS on $GITHUB_REF_NAME"
            git push -q origin ci-reports && break
            sleep $((attempt * 5))
          done

  desktop:
    name: Desktop (Windows)
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        run: set -o pipefail; npm ci 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Smoke test - the app starts and its window loads
        run: set -o pipefail; npx electron . --smoke 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Build the installer
        run: set -o pipefail; npm run dist 2>&1 | tail -n 80 | tee -a "$RUNNER_TEMP/ci.log"
      - uses: actions/upload-artifact@v4
        with:
          name: continuum-desktop-windows
          path: desktop/dist/*.exe
          if-no-files-found: error
      - name: Publish the release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          {
            version="${GITHUB_REF_NAME#v}"
            packaged="$(node -p "require('./package.json').version")"
            if [ "$packaged" != "$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match desktop/package.json version $packaged" >&2
              exit 1
            fi
            installer="dist/Continuum-Setup-${version}.exe"
            notes="../docs/releases/${GITHUB_REF_NAME}.md"
            # A tag pushed again (after a failed run) updates its release instead of failing on it.
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" "$installer" --clobber
              gh release edit "$GITHUB_REF_NAME" --title "Continuum ${version}" --notes-file "$notes" --latest
            else
              gh release create "$GITHUB_REF_NAME" "$installer" --title "Continuum ${version}" --notes-file "$notes" --latest
            fi
            gh release view "$GITHUB_REF_NAME" --json url,assets --jq '.url, .assets[].name'
          } 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
      - name: Report back to the ci-reports branch
        # Whoever cannot open the Actions page (a token without Actions access) can still read how a run went with git.
        if: always()
        shell: bash
        working-directory: .
        env:
          STATUS: ${{ job.status }}
          TOKEN: ${{ github.token }}
        run: |
          log="$RUNNER_TEMP/ci.log"; touch "$log"
          dir="$RUNNER_TEMP/report"; rm -rf "$dir"; mkdir -p "$dir"; cd "$dir"
          git init -q
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          name="$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}-${GITHUB_REF_NAME//\//_}-${GITHUB_JOB}.txt"
          for attempt in 1 2 3 4; do
            if git fetch -q origin ci-reports 2>/dev/null; then git checkout -q -B ci-reports FETCH_HEAD; else git checkout -q --orphan ci-reports; fi
            { echo "status: $STATUS"; echo "ref: $GITHUB_REF"; echo "sha: $GITHUB_SHA"; echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"; echo; tail -c 60000 "$log"; } > "$name"
            git add "$name"
            git -c user.name="continuum-ci" -c user.email="ci@users.noreply.github.com" commit -qm "CI: $GITHUB_JOB $STATUS on $GITHUB_REF_NAME"
            git push -q origin ci-reports && break
            sleep $((attempt * 5))
          done
