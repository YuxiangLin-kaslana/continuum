<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 568" width="960" height="568">
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Droid Sans Fallback",sans-serif;fill:#1f2328}
.t{font-size:17px;font-weight:600}
.n{font-size:13.5px;font-weight:600}
