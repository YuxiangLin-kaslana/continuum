<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 372" width="960" height="372">
<style>
text{font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Droid Sans Fallback",sans-serif;fill:#1f2328}
.t{font-size:17px;font-weight:600}
.n{font-size:13.5px;font-weight:600}
.s{font-size:11.5px;fill:#57606a}
.q{font-size:11.5px;fill:#57606a}
.box{fill:#fff;stroke:#8c959f;stroke-width:1.2}
.acc{fill:#ddf4ff;stroke:#0969da;stroke-width:2}
.cont{fill:none;stroke:#8c959f;stroke-width:1;stroke-dasharray:5 4}
.res{fill:#fff;stroke:#8c959f;stroke-width:1.2;stroke-dasharray:4 3}
.ln{fill:none;stroke:#57606a;stroke-width:1.3}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text class="t" x="24" y="36">内置和第三方插件走同一条路，只能通过收窄的 Context 请求内核</text>
<rect class="box" x="24" y="92" width="176" height="56" rx="8"/>
<text class="n" x="36" y="113">内置插件</text>
<text class="s" x="36" y="130">continuum.plugins.*</text>
<path class="ln" d="M200 120H216"/>
<rect class="box" x="24" y="168" width="176" height="56" rx="8"/>
<text class="n" x="36" y="189">第三方包</text>
<text class="s" x="36" y="206">entry points</text>
<path class="ln" d="M200 196H216"/>
<rect class="box" x="24" y="244" width="176" height="56" rx="8"/>
<text class="n" x="36" y="265">本地目录</text>
<text class="s" x="36" y="282">plugins/*.py</text>
<path class="ln" d="M200 272H216"/>
<path class="ln" d="M216 120V272"/>
<path class="ln" d="M216 196H232" marker-end="url(#a)"/>
<rect class="box" x="232" y="152" width="150" height="88" rx="8"/>
<text class="n" x="244" y="173">发现与加载</text>
<text class="s" x="244" y="190">检查 api_version</text>
<text class="s" x="244" y="205">同名冲突拒绝启动</text>
<path class="ln" d="M382 196H410" marker-end="url(#a)"/>
<rect class="box" x="410" y="152" width="150" height="88" rx="8"/>
<text class="n" x="422" y="173">配置校验</text>
<text class="s" x="422" y="190">插件自带 pydantic 模型</text>
<text class="s" x="422" y="205">失败只停用该实例</text>
<path class="ln" d="M560 196H588" marker-end="url(#a)"/>
<rect class="box" x="588" y="72" width="160" height="252" rx="8"/>
<text class="n" x="600" y="94">注册表（扩展点）</text>
<text class="s" x="604" y="120.0">Source</text>
<text class="s" x="604" y="139.5">GateRule</text>
<text class="s" x="604" y="159.0">ProactiveRule</text>
<text class="s" x="604" y="178.5">Assessor</text>
<text class="s" x="604" y="198.0">ExecutorKind</text>
<text class="s" x="604" y="217.5">ToolProvider</text>
<text class="s" x="604" y="237.0">ModelProvider</text>
<text class="s" x="604" y="256.5">EffectHandler</text>
<text class="s" x="604" y="276.0">EventSubscriber</text>
<text class="s" x="604" y="295.5">Repositories</text>
<path class="ln" d="M748 156H776" marker-end="url(#a)"/>
<rect class="box" x="776" y="116" width="160" height="80" rx="8"/>
<text class="n" x="788" y="137">收窄 Context</text>
<text class="s" x="788" y="154">Engine 角色视图</text>
<text class="s" x="788" y="169">自己的 KV · 健康项</text>
<text class="s" x="788" y="184">配置 · 权限声明</text>
<path class="ln" d="M856 196V236" marker-end="url(#a)"/>
<text class="q" x="866" y="222">只能请求</text>
<rect class="acc" x="776" y="236" width="160" height="64" rx="8"/>
<text class="n" x="788" y="257">Engine</text>
<text class="s" x="788" y="274">唯一写入者</text>
<text class="s" x="788" y="289">可拒绝请求</text>
<text class="q" x="24" y="352">插件看不到 Store，也改不了工单；它拿到的是对应角色的 Engine 视图，例如 Source 只能 receive / bind_thread / thread_closed。</text>
</svg>
