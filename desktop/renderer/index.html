<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Continuum</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- The title bar: the window has no frame of its own, so this strip is where it is dragged. -->
    <div class="titlebar">
      <span class="ident"><svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="m-lit" x1=".1" y1=".1" x2=".8" y2=".9"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#ffeccb"/><stop offset="1" stop-color="#ffbf73"/></linearGradient><mask id="m-small"><rect width="24" height="24" fill="#000"/><circle cx="11" cy="11" r="8" fill="#fff"/><circle cx="14.2" cy="9.4" r="7.1" fill="#000"/></mask></defs><circle cx="11" cy="11" r="8" fill="none" stroke="#9ec6ff" stroke-opacity=".35" stroke-width=".8"/><rect width="24" height="24" fill="url(#m-lit)" mask="url(#m-small)"/></svg><span class="callsign">CONTINUUM</span><span class="build" aria-hidden="true">TACTICAL ASSISTANT · 0.0.2</span></span>
      <span class="window-controls">
        <button id="win-min" class="win min" title="最小化" aria-label="最小化"></button>
        <button id="win-close" class="win close" title="收进托盘" aria-label="收进托盘"></button>
      </span>
    </div>

    <section id="setup" class="setup" hidden>
      <div class="setup-card frame">
        <div class="wordmark" aria-hidden="true">
          <svg class="wm-moon" viewBox="0 0 200 150" aria-hidden="true">
            <defs>
              <radialGradient id="w-halo" cx=".48" cy=".44" r=".5"><stop offset=".45" stop-color="#ffe7c2" stop-opacity=".30"/><stop offset="1" stop-color="#ffe7c2" stop-opacity="0"/></radialGradient>
              <linearGradient id="w-lit" x1=".1" y1=".1" x2=".8" y2=".9"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#ffeccb"/><stop offset="1" stop-color="#ffbf73"/></linearGradient>
              <linearGradient id="w-rim" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ec6ff" stop-opacity=".8"/><stop offset="1" stop-color="#b98cff" stop-opacity=".15"/></linearGradient>
              <mask id="m-big"><rect width="200" height="150" fill="#000"/><circle cx="96" cy="68" r="50" fill="#fff"/><circle cx="117" cy="57" r="44" fill="#000"/></mask>
              <filter id="w-glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            </defs>
            <circle cx="96" cy="68" r="66" fill="url(#w-halo)"/>
            <circle cx="96" cy="68" r="50" fill="#1b1840" fill-opacity=".4" stroke="url(#w-rim)" stroke-width="1.5"/>
            <g filter="url(#w-glow)"><rect width="200" height="150" fill="url(#w-lit)" mask="url(#m-big)"/></g>
            <circle cx="160" cy="24" r="2.4" fill="#fff"/>
            <circle cx="174" cy="52" r="1.2" fill="#fff" opacity=".7"/>
            <circle cx="30" cy="30" r="1.2" fill="#fff" opacity=".6"/>
          </svg>
          <div class="wm-title">CONTINUUM</div>
          <div class="wm-sub">TACTICAL ASSISTANT</div>
        </div>
        <p class="hud-label" aria-hidden="true">ESTABLISH UPLINK</p>
        <h1 class="setup-title">连接到 Continuum 服务器</h1>
        <p class="lead">令牌由管理员在服务器上用 <code>continuum user add</code> 生成，只显示一次。</p>
        <form id="setup-form">
          <label for="server">服务器地址 <span class="en" aria-hidden="true">UPLINK</span></label>
          <input id="server" name="server" type="url" placeholder="https://continuum.example.com" required autocomplete="url" spellcheck="false">
          <label for="token">令牌 <span class="en" aria-hidden="true">AUTH CODE</span></label>
          <input id="token" name="token" type="password" placeholder="ctm_…" required autocomplete="off" spellcheck="false">
          <p id="setup-error" class="error" role="alert" hidden></p>
          <button id="connect" type="submit" class="primary">连接 <span class="en" aria-hidden="true">ENGAGE</span></button>
        </form>
      </div>
    </section>

    <section id="main" class="main" hidden>
      <header class="bar">
        <div class="link">
          <span id="dot" class="dot" title="连接状态"></span>
          <span id="link-text" class="link-text" aria-hidden="true">LINK OFFLINE</span>
          <span class="pilot"><span class="en" aria-hidden="true">PILOT</span> <span id="user" class="user"></span></span>
        </div>
        <nav class="tabs" role="tablist">
          <button id="tab-chat" role="tab" aria-selected="true" data-view="chat">对话<span class="en" aria-hidden="true">COMMS</span></button>
          <button id="tab-tickets" role="tab" aria-selected="false" data-view="tickets">工单<span class="en" aria-hidden="true">MISSIONS</span><span id="badge" class="badge" hidden></span></button>
        </nav>
        <button id="menu" class="ghost logout" title="退出登录">退出</button>
      </header>

      <div id="view-chat" class="view chat">
        <div class="threads">
          <label for="thread" class="sr">对话</label>
          <span class="hud-label" aria-hidden="true">CHANNEL</span>
          <select id="thread"></select>
          <button id="new-thread" class="ghost" title="新对话">＋ 新对话</button>
        </div>
        <ol id="messages" class="messages" aria-live="polite"></ol>
        <div id="empty-chat" class="empty" hidden>
          <span class="hud-label" aria-hidden="true">NO TRANSMISSIONS</span>
          <p>说一件你想交给它的事，比如“帮我检查这版 BOM 报价有没有问题”。</p>
        </div>
        <form id="composer" class="composer">
          <label for="input" class="sr">消息</label>
          <div class="input-frame frame">
            <span class="prompt" aria-hidden="true">›</span>
            <textarea id="input" rows="2" placeholder="交代一件事，Enter 发送，Shift+Enter 换行"></textarea>
          </div>
          <button id="send" type="submit" class="primary">发送<span class="en" aria-hidden="true">TRANSMIT</span></button>
        </form>
      </div>

      <div id="view-tickets" class="view tickets" hidden>
        <div id="tickets"></div>
        <div id="empty-tickets" class="empty" hidden>
          <span class="hud-label" aria-hidden="true">NO ACTIVE MISSIONS</span>
          <p>还没有工单。在对话里交代一件事，接下来就会出现在这里。</p>
        </div>
      </div>

      <footer id="status" class="status" role="status" hidden></footer>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
