[project]
name = "continuum"
version = "0.0.1"
description = "Continuum（续）：常驻在操作系统里的 AI 幕僚长"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8", "fastapi>=0.115", "uvicorn>=0.30", "websockets>=13"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.6", "ruff", "httpx>=0.27"]

[project.scripts]
continuum = "continuum.runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/continuum"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
# Side by side, one process per core: the whole suite must stay within a minute (see tests/conftest.py).
addopts = "-n auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "B"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
